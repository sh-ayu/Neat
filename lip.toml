format = 4
id = "github.com/sh-ayu/Neat"
version = "0.1.3"

[info]
name = "Neat"
description = "Overhead health bars for mobs and optional player health bars in Minecraft Bedrock with LeviLamina."
tags = ["visual", "utility"]
logo = "https://raw.githubusercontent.com/sh-ayu/Neat/main/assets/icon.png"

[[variants.""]]
side = "client"
platform = "win-x64"
preserve = ["mods/Neat/config/"]

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = "26.60.9"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/Neat-client-windows-x64.zip"]
place = [{ src = "Neat/", dest = "mods/Neat/" }]
